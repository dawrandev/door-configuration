document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  }\n\n  tr(d) { return d[this.state.lang] || d.uz; }\n  fmt(n) { return n.toLocaleString('ru-RU') + ' ' + this.tr(this.T.som); }\n\n  T = {\n    som:{uz:\"so'm\",kk:\"sum\",ru:\"сум\"},\n    brandkicker:{uz:\"Qoraqalpoq eshik ustaxonasi\",kk:\"Qaraqalpaq esik ustaxanası\",ru:\"Каракалпакская мастерская дверей\"},\n    tagline:{uz:\"O'z eshigingizni loyihalang\",kk:\"Óz esigińizdi jobalań\",ru:\"Спроектируйте свою дверь\"},\n    sub:{uz:\"Devorni tanlang, eshigingizni yarating va aniq narxini ko'ring.\",kk:\"Diywaldı saylań, esigińizdi jasań hám anıq bahasın kóriń.\",ru:\"Выберите стену, создайте дверь и узнайте точную цену.\"},\n    start:{uz:\"Boshlash\",kk:\"Baslaw\",ru:\"Начать\"},\n    step:{uz:\"Qadam\",kk:\"Qádem\",ru:\"Шаг\"},\n    back:{uz:\"Orqaga\",kk:\"Artqa\",ru:\"Назад\"},\n    next:{uz:\"Davom etish\",kk:\"Dawam etiw\",ru:\"Продолжить\"},\n    startover:{uz:\"Boshidan boshlash\",kk:\"Qaytadan baslaw\",ru:\"Начать заново\"},\n    getpdf:{uz:\"PDF-ni chop etish\",kk:\"PDF basıp shıǵarıw\",ru:\"Распечатать PDF\"},\n    step1:{uz:\"Devoringizni tanlang\",kk:\"Diywaldı saylań\",ru:\"Выберите стену\"},\n    step2:{uz:\"Eshigingizni tanlang\",kk:\"Esikti saylań\",ru:\"Выберите дверь\"},\n    step3:{uz:\"Eshigingizni sozlang\",kk:\"Esikti sazlań\",ru:\"Настройте дверь\"},\n    sumt:{uz:\"Yakuniy ko'rinish\",kk:\"Juwmaqlaw\",ru:\"Итог\"},\n    finish:{uz:\"Bo'yoq\",kk:\"Boyaw\",ru:\"Отделка\"},\n    pattern:{uz:\"Naqsh\",kk:\"Naqıs\",ru:\"Узор\"},\n    glass:{uz:\"Oyna\",kk:\"Áynek\",ru:\"Стекло\"},\n    handle:{uz:\"Dastak\",kk:\"Tutqa\",ru:\"Ручка\"},\n    handlefinish:{uz:\"Dastak rangi\",kk:\"Tutqa reńi\",ru:\"Цвет ручки\"},\n    wall:{uz:\"Devor\",kk:\"Diywal\",ru:\"Стена\"},\n    model:{uz:\"Model\",kk:\"Model\",ru:\"Модель\"},\n    price:{uz:\"Narx\",kk:\"Bahası\",ru:\"Цена\"},\n    estprice:{uz:\"Taxminiy narx\",kk:\"Shama menen bahası\",ru:\"Ориентировочная цена\"},\n    swipehint:{uz:\"Almashtirish uchun suring\",kk:\"Almastırıw ushın sırǵıtıń\",ru:\"Проведите, чтобы сменить\"},\n    layoutTabs:{uz:\"Yorliqli\",kk:\"Betbelgili\",ru:\"Вкладки\"},\n    layoutList:{uz:\"Ro'yxat\",kk:\"Dizim\",ru:\"Список\"},\n    none:{uz:\"Yo'q\",kk:\"Joq\",ru:\"Нет\"},\n    cat:{\n      plaster:{uz:\"Suvoq\",kk:\"Suwaq\",ru:\"Штукатурка\"},\n      wallpaper:{uz:\"Oboy\",kk:\"Oboy\",ru:\"Обои\"},\n      brick:{uz:\"G'isht\",kk:\"Kerpish\",ru:\"Кирпич\"},\n      stone:{uz:\"Tosh\",kk:\"Tas\",ru:\"Камень\"},\n      tile:{uz:\"Kafel\",kk:\"Kafel\",ru:\"Плитка\"},\n    },\n    doorName:{\n      classic:{uz:\"Klassik panel\",kk:\"Klassik panel\",ru:\"Классическая филёнка\"},\n      flush:{uz:\"Zamonaviy tekis\",kk:\"Zamanagóy tegis\",ru:\"Современная гладкая\"},\n      glazed:{uz:\"Oyna qanotli\",kk:\"Áynekli\",ru:\"Со стеклом\"},\n      naqsh:{uz:\"Naqshli eshik\",kk:\"Naqıslı esik\",ru:\"С резьбой\"},\n    },\n    finishName:{\n      walnut:{uz:\"Yong'oq\",kk:\"Jańǵaq\",ru:\"Орех\"},\n      oak:{uz:\"Eman\",kk:\"Emen\",ru:\"Дуб\"},\n      white:{uz:\"Oq bo'yoq\",kk:\"Aq boyaw\",ru:\"Белая краска\"},\n      graphite:{uz:\"Grafit\",kk:\"Grafit\",ru:\"Графит\"},\n      bronze:{uz:\"Matt bronza\",kk:\"Matt bronza\",ru:\"Матовая бронза\"},\n    },\n    patternName:{\n      none:{uz:\"Yo'q\",kk:\"Joq\",ru:\"Нет\"},\n      qoshqar:{uz:\"Qo'shqor muyiz\",kk:\"Qospaq múyiz\",ru:\"Кошкар-муйиз\"},\n      lattice:{uz:\"Panjara\",kk:\"Pánjara\",ru:\"Решётка\"},\n    },\n    glassName:{\n      none:{uz:\"Yo'q\",kk:\"Joq\",ru:\"Нет\"},\n      frosted:{uz:\"Xira oyna\",kk:\"Xira áynek\",ru:\"Матовое стекло\"},\n      clear:{uz:\"Tiniq oyna\",kk:\"Taza áynek\",ru:\"Прозрачное стекло\"},\n    },\n    handleName:{\n      chrome:{uz:\"Xrom\",kk:\"Xrom\",ru:\"Хром\"},\n      black:{uz:\"Qora\",kk:\"Qara\",ru:\"Чёрный\"},\n      bronze:{uz:\"Bronza\",kk:\"Bronza\",ru:\"Бронза\"},\n      gold:{uz:\"Oltin\",kk:\"Altın\",ru:\"Золото\"},\n    },\n    wallName:{\n      \"plaster-warm\":{uz:\"Iliq suvoq\",kk:\"Jıllı suwaq\",ru:\"Тёплая штукатурка\"},\n      \"plaster-grey\":{uz:\"Kulrang suvoq\",kk:\"Kúlreń suwaq\",ru:\"Серая штукатурка\"},\n      \"wallpaper-stripe\":{uz:\"Chiziqli oboy\",kk:\"Sızıqlı oboy\",ru:\"Полосатые обои\"},\n      \"wallpaper-rose\":{uz:\"Muloyim oboy\",kk:\"Jumsaq oboy\",ru:\"Мягкие обои\"},\n      \"brick-red\":{uz:\"Qizil g'isht\",kk:\"Qızıl kerpish\",ru:\"Красный кирпич\"},\n      \"brick-white\":{uz:\"Oq g'isht\",kk:\"Aq kerpish\",ru:\"Белёный кирпич\"},\n      \"stone-sand\":{uz:\"Qumtosh\",kk:\"Qumtas\",ru:\"Песчаник\"},\n      \"stone-slate\":{uz:\"Slanets\",kk:\"Slanets\",ru:\"Сланец\"},\n      \"tile-blue\":{uz:\"Naqshli kafel\",kk:\"Naqıslı kafel\",ru:\"Узорная плитка\"},\n    },\n  };\n\n  WALLS = [\n    { id:'plaster-warm', cat:'plaster' }, { id:'plaster-grey', cat:'plaster' },\n    { id:'wallpaper-stripe', cat:'wallpaper' }, { id:'wallpaper-rose', cat:'wallpaper' },\n    { id:'brick-red', cat:'brick' }, { id:'brick-white', cat:'brick' },\n    { id:'stone-sand', cat:'stone' }, { id:'stone-slate', cat:'stone' },\n    { id:'tile-blue', cat:'tile' },\n  ];\n\n  wallBg(id) {\n    const B = {\n      'plaster-warm':'radial-gradient(circle at 28% 22%, rgba(255,255,255,.14), transparent 42%), radial-gradient(circle at 72% 66%, rgba(0,0,0,.07), transparent 46%), linear-gradient(150deg,#d8cbb4,#cebfa4)',\n      'plaster-grey':'radial-gradient(circle at 30% 25%, rgba(255,255,255,.12), transparent 40%), linear-gradient(150deg,#c6c4bc,#b8b6ad)',\n      'wallpaper-stripe':'repeating-linear-gradient(90deg,#d9d0c0 0 42px,#d1c7b3 42px 84px)',\n      'wallpaper-rose':'radial-gradient(circle at 50% 38%, rgba(150,120,120,.10), transparent 52%), linear-gradient(160deg,#d7c9c3,#cabbb4)',\n      'brick-red':'linear-gradient(0deg, rgba(0,0,0,.16) 0 3px, transparent 3px) 0 0/100% 48px, linear-gradient(90deg, rgba(0,0,0,.16) 0 3px, transparent 3px) 0 0/96px 100%, linear-gradient(150deg,#b47a5c,#a86d4f)',\n      'brick-white':'linear-gradient(0deg, rgba(0,0,0,.08) 0 3px, transparent 3px) 0 0/100% 48px, linear-gradient(90deg, rgba(0,0,0,.08) 0 3px, transparent 3px) 0 0/96px 100%, linear-gradient(150deg,#dcd6ca,#d2ccbe)',\n      'stone-sand':'linear-gradient(0deg, rgba(0,0,0,.10) 0 2px, transparent 2px) 0 0/100% 72px, linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, transparent 2px) 0 0/124px 100%, linear-gradient(150deg,#cbba97,#bfad88)',\n      'stone-slate':'linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px) 0 0/100% 62px, linear-gradient(90deg, rgba(0,0,0,.16) 0 2px, transparent 2px) 0 0/104px 100%, linear-gradient(150deg,#8f9599,#7d848a)',\n      'tile-blue':'linear-gradient(0deg, rgba(255,255,255,.22) 0 2px, transparent 2px) 0 0/100% 92px, linear-gradient(90deg, rgba(255,255,255,.22) 0 2px, transparent 2px) 0 0/92px 100%, linear-gradient(150deg,#a9b7b3,#98a8a4)',\n    };\n    return B[id] || B['plaster-warm'];\n  }\n\n  DOORS = [\n    { id:'classic', base:3200000 }, { id:'flush', base:2800000 },\n    { id:'glazed', base:3600000 }, { id:'naqsh', base:4200000 },\n  ];\n  FINISHES = [\n    { id:'walnut', prem:900000, sw:'#4b3623' },\n    { id:'oak', prem:500000, sw:'#b2926a' },\n    { id:'white', prem:200000, sw:'#e7e2d6' },\n    { id:'graphite', prem:300000, sw:'#3b3e42' },\n    { id:'bronze', prem:1100000, sw:'linear-gradient(135deg,#c7a97c,#7c6a4b 55%,#5a4830)' },\n  ];\n  PATTERNS = [\n    { id:'none', prem:0 }, { id:'qoshqar', prem:600000 }, { id:'lattice', prem:400000 },\n  ];\n  GLASS = [\n    { id:'none', prem:0 }, { id:'frosted', prem:500000 }, { id:'clear', prem:350000 },\n  ];\n  HANDLES = [\n    { id:'chrome', prem:150000, sw:'linear-gradient(135deg,#eef1f2,#b9c0c4 50%,#7d858a)' },\n    { id:'black', prem:150000, sw:'linear-gradient(135deg,#4a4d52,#25272a 55%,#0e0f10)' },\n    { id:'bronze', prem:300000, sw:'linear-gradient(135deg,#c7a97c,#8c7350 55%,#5a4830)' },\n    { id:'gold', prem:450000, sw:'linear-gradient(135deg,#e9cf86,#c9a24a 55%,#8a6f2c)' },\n  ];\n\n  patternSw(id) {\n    const surf = '#ded4c2';\n    if (id === 'lattice') return `repeating-linear-gradient(45deg,rgba(51,41,31,.30) 0 1.5px,transparent 1.5px 12px),repeating-linear-gradient(-45deg,rgba(51,41,31,.30) 0 1.5px,transparent 1.5px 12px),${surf}`;\n    if (id === 'qoshqar') {\n      const q = `<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><g fill='none' stroke='rgba(51,41,31,.45)' stroke-width='2' stroke-linecap='round'><path d='M30 40 C30 31 26 21 18 21 C11 21 8 27 12 31 C15 34 19 32 17 28'/><path d='M30 40 C30 31 34 21 42 21 C49 21 52 27 48 31 C45 34 41 32 43 28'/><\u002Fg><\u002Fsvg>`;\n      return `url(\"data:image/svg+xml,${encodeURIComponent(q)}\") center/44px ${surf}`;\n    }\n    return `linear-gradient(135deg, transparent 46%, rgba(51,41,31,.35) 46% 54%, transparent 54%), ${surf}`;\n  }\n  glassSw(id) {\n    if (id === 'frosted') return 'linear-gradient(160deg,#eef0ee,#ced6d4)';\n    if (id === 'clear') return 'linear-gradient(160deg,#c6d6d8,#96acae)';\n    return 'linear-gradient(135deg, transparent 46%, rgba(51,41,31,.35) 46% 54%, transparent 54%), #ded4c2';\n  }\n\n  set(k, v) { this.setState({ [k]: v }); }\n  cycleLang = () => {\n    const o = ['uz','kk','ru']; const i = o.indexOf(this.state.lang);\n    this.setState({ lang: o[(i+1)%3] });\n  };\n  reset = () => this.setState({ screen:'attract', wallId:'plaster-warm', doorIx:0, finish:'walnut', pattern:'none', glass:'none', handleFinish:'bronze', tab:'finish' });\n  getPdf = () => { window.print(); };\n\n  onDown = (e) => { this._px = e.clientX; };\n  onUp = (e) => {\n    if (this.props.swipeEnabled === false) return;\n    const dx = e.clientX - this._px;\n    if (Math.abs(dx) < 60) return;\n    const n = this.DOORS.length;\n    this.setState(s => ({ doorIx: (s.doorIx + (dx < 0 ? 1 : -1) + n) % n }));\n  };\n\n  ringBtn(base, sel) {\n    return base + (sel ? 'box-shadow:inset 0 0 0 2px #8a7048; ' : 'box-shadow:inset 0 0 0 1px rgba(51,41,31,.12); ');\n  }\n\n  renderVals() {\n    const s = this.state;\n    const L = {};\n    for (const k in this.T) { if (!['cat','doorName','finishName','patternName','glassName','handleName','wallName','som'].includes(k)) L[k] = this.tr(this.T[k]); }\n\n    const currentDoor = this.DOORS[s.doorIx];\n    const finObj = this.FINISHES.find(f=>f.id===s.finish);\n    const patObj = this.PATTERNS.find(p=>p.id===s.pattern);\n    const glsObj = this.GLASS.find(g=>g.id===s.glass);\n    const hndObj = this.HANDLES.find(h=>h.id===s.handleFinish);\n    const price = currentDoor.base + finObj.prem + patObj.prem + glsObj.prem + hndObj.prem;\n\n    // language buttons (attract)\n    const langMeta = { uz:\"O'zbekcha\", kk:'Qaraqalpaqsha', ru:'Русский' };\n    const langs = ['uz','kk','ru'].map(code => {\n      const sel = s.lang === code;\n      return {\n        code, name: langMeta[code], sel,\n        style: `min-height:80px; padding:14px 40px; border-radius:6px; background:${sel?'#efe9dd':'none'}; border:1px solid ${sel?'rgba(138,112,72,.5)':'rgba(51,41,31,.2)'}; font-family:'IBM Plex Sans'; font-size:28px; color:#33291f; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;`,\n        pick: () => this.set('lang', code),\n      };\n    });\n    const langShort = { uz:'UZ', kk:'QQ', ru:'RU' }[s.lang];\n\n    // walls grouped\n    const cats = ['plaster','wallpaper','brick','stone','tile'];\n    const wallGroups = cats.map(cat => ({\n      cat, catLabel: this.tr(this.T.cat[cat]),\n      items: this.WALLS.filter(w=>w.cat===cat).map(w => {\n        const sel = s.wallId === w.id;\n        return {\n          id:w.id, name:this.tr(this.T.wallName[w.id]), bg:this.wallBg(w.id), sel,\n          style: `background:${sel?'#efe9dd':'#eae3d5'}; border:none; border-radius:8px; padding:16px; cursor:pointer; text-align:left; ${sel?'box-shadow:0 0 0 2px #8a7048, 0 12px 24px rgba(30,22,14,.12);':'box-shadow:inset 0 0 0 1px rgba(51,41,31,.08);'}`,\n          pick: () => this.set('wallId', w.id),\n        };\n      }),\n    }));\n\n    // door carousel\n    const doorItems = this.DOORS.map((d,ix) => {\n      const sel = s.doorIx === ix;\n      return {\n        id:d.id, name:this.tr(this.T.doorName[d.id]), sel,\n        style: `flex:0 0 auto; background:${sel?'#efe9dd':'#eae3d5'}; border:none; border-radius:8px; padding:16px 16px 18px; cursor:pointer; display:flex; flex-direction:column; align-items:center; ${sel?'box-shadow:0 0 0 2px #8a7048, 0 14px 26px rgba(30,22,14,.14);':'box-shadow:inset 0 0 0 1px rgba(51,41,31,.08);'}`,\n        pick: () => this.set('doorIx', ix),\n      };\n    });\n\n    const swBox = 'width:150px; height:78px; border-radius:5px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);';\n    const swCircle = 'width:78px; height:78px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.14), 0 2px 6px rgba(0,0,0,.2);';\n    const itemBtnBase = \"flex:0 0 auto; padding:14px; border:none; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:12px; border-radius:8px; color:#33291f; font-family:'IBM Plex Sans';\";\n\n    const mkItem = (id, name, sw, sel, pick, circle) => ({\n      id, name, sel, pick,\n      swStyle: `${circle?swCircle:swBox} background:${sw};`,\n      style: this.ringBtn(itemBtnBase + (circle?' padding-bottom:14px;':''), sel).replace('inset 0 0 0 1px rgba(51,41,31,.12);','inset 0 0 0 1px rgba(51,41,31,.10);'),\n    });\n\n    const finishItems = this.FINISHES.map(f => mkItem(f.id, this.tr(this.T.finishName[f.id]), f.sw, s.finish===f.id, ()=>this.set('finish',f.id), false));\n    const patternItems = this.PATTERNS.map(p => mkItem(p.id, this.tr(this.T.patternName[p.id]), this.patternSw(p.id), s.pattern===p.id, ()=>this.set('pattern',p.id), false));\n    const glassItems = this.GLASS.map(g => mkItem(g.id, this.tr(this.T.glassName[g.id]), this.glassSw(g.id), s.glass===g.id, ()=>this.set('glass',g.id), false));\n    const handleItems = this.HANDLES.map(h => mkItem(h.id, this.tr(this.T.handleName[h.id]), h.sw, s.handleFinish===h.id, ()=>this.set('handleFinish',h.id), true));\n\n    // tabs\n    const tabDefs = [['finish',L.finish],['pattern',L.pattern],['glass',L.glass],['handle',L.handlefinish]];\n    const tabs = tabDefs.map(([id,label]) => {\n      const active = s.tab === id;\n      return {\n        id, label, active,\n        style: `flex:1; min-height:78px; border:none; cursor:pointer; border-radius:7px 7px 0 0; background:${active?'#efe9dd':'transparent'}; color:${active?'#33291f':'#5f5342'}; font-family:'IBM Plex Sans'; font-size:27px; font-weight:${active?600:400}; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 6px;`,\n        pick: () => this.set('tab', id),\n      };\n    });\n    const activeItems = { finish:finishItems, pattern:patternItems, glass:glassItems, handle:handleItems }[s.tab];\n\n    const sections = [\n      { key:'finish', label:L.finish, items:finishItems },\n      { key:'pattern', label:L.pattern, items:patternItems },\n      { key:'glass', label:L.glass, items:glassItems },\n      { key:'handle', label:L.handlefinish, items:handleItems },\n    ];\n\n    // variant segments\n    const seg = (on) => `min-height:60px; padding:0 26px; border-radius:5px; cursor:pointer; font-family:'IBM Plex Sans'; font-size:24px; background:${on?'rgba(51,41,31,.92)':'rgba(236,229,215,.86)'}; color:${on?'#ece5d7':'#33291f'}; border:1px solid ${on?'transparent':'rgba(51,41,31,.16)'}; backdrop-filter:blur(4px);`;\n\n    // spec rows\n    const specRows = [\n      { label:L.model, value:this.tr(this.T.doorName[currentDoor.id]) },\n      { label:L.wall, value:this.tr(this.T.wallName[s.wallId]) },\n      { label:L.finish, value:this.tr(this.T.finishName[s.finish]) },\n      { label:L.pattern, value:this.tr(this.T.patternName[s.pattern]) },\n      { label:L.glass, value:this.tr(this.T.glassName[s.glass]) },\n      { label:L.handlefinish, value:this.tr(this.T.handleName[s.handleFinish]) },\n    ];\n\n    return {\n      L, langs, langShort,\n      isAttract:s.screen==='attract', isWall:s.screen==='wall', isDoor:s.screen==='door',\n      isCustomize:s.screen==='customize', isSummary:s.screen==='summary',\n      wallGroups, doorItems, wallBg:this.wallBg(s.wallId), currentDoor,\n      finish:s.finish, pattern:s.pattern, glass:s.glass, handleFinish:s.handleFinish,\n      priceFmt:this.fmt(price),\n      tabs, activeItems, sections,\n      isVarA:s.variant==='A', isVarB:s.variant==='B',\n      custPreviewH: s.variant==='A' ? '820px' : '700px',\n      segA:seg(s.variant==='A'), segB:seg(s.variant==='B'),\n      setVariantA:()=>this.set('variant','A'), setVariantB:()=>this.set('variant','B'),\n      specRows,\n      cycleLang:this.cycleLang, reset:this.reset, getPdf:this.getPdf,\n      swipe:{ down:this.onDown, up:this.onUp },\n      go: {\n        start:()=>this.set('screen','wall'),\n        attract:()=>this.set('screen','attract'),\n        wall:()=>this.set('screen','wall'),\n        door:()=>this.set('screen','door'),\n        customize:()=>this.set('screen','customize'),\n        summary:()=>this.set('screen','summary'),\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
