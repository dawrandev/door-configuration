name: Build & Deploy

# Does on every push to main what deploy.sh + server-deploy.sh do by hand:
#
#   1. test the backend and the showroom,
#   2. build the showroom,
#   3. force-push a deployable tree — the backend source with the built
#      showroom already inside public/ — to the "deploy" branch,
#   4. SSH into the server and run server-deploy.sh there.
#
# main's history therefore never carries build artifacts, and the server
# never needs Node.
#
# One-time server setup: backend/docs/deploy.md

on:
  push:
    branches: [main]
    paths:
      - 'kiosk/**'
      - 'backend/**'
      - 'deploy.sh'
      - 'server-deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:        # lets you re-deploy from the Actions tab by hand

# Never let two deploys race each other onto the same branch/server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_BRANCH: deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to force-push the deploy branch

    services:
      # The suite runs against MySQL deliberately, not sqlite: the schema
      # leans on json and enum columns the two engines disagree about
      # (backend/phpunit.xml says why).
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: door_configurator_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- backend

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The floor composer.json declares. If it passes here it passes on
          # anything newer the server happens to run.
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, tokenizer, xml, ctype, fileinfo, curl
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the test environment
        working-directory: backend
        # No .env is committed, and without an APP_KEY the encrypter throws on
        # the first session cookie. DB_* are read by config/database.php from
        # the environment; phpunit.xml supplies DB_DATABASE.
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: Test the backend
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

      # ---------------------------------------------------------------- showroom

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kiosk/package-lock.json

      - name: Install dependencies
        working-directory: kiosk
        # Playwright/sharp are only used by the offline tools/ scripts, so skip
        # the ~400MB browser download the playwright postinstall would trigger.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Lint
        working-directory: kiosk
        run: npm run lint

      - name: Test the showroom
        working-directory: kiosk
        run: npm test

      - name: Build
        working-directory: kiosk
        # base=/ because the app is served from the root of its own subdomain,
        # with the document root pointing at public/. A sub-path would also
        # need the API base to move, since the SPA addresses /api absolutely.
        run: npx tsc -b && npx vite build --base=/

      # ---------------------------------------------------------------- publish

      - name: Publish to the '${{ env.DEPLOY_BRANCH }}' branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A throwaway repo holding one rolling commit: the deploy branch is
          # force-pushed fresh every run, so it never accumulates history.
          rm -rf .deploy-out
          mkdir .deploy-out
          # The backend as git has it — no vendor, no .env, no local storage
          # contents. `git archive` also skips the build output .gitignore
          # keeps out of main.
          git archive HEAD backend | tar -x -C .deploy-out --strip-components=1
          cp -r kiosk/dist/. .deploy-out/public/
          cp server-deploy.sh .deploy-out/
          cd .deploy-out
          git init -q -b "$DEPLOY_BRANCH"
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -qm "deploy: ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:$DEPLOY_BRANCH"

      - name: Deploy on the server over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key when SSH_KNOWN_HOSTS is set; otherwise trust the
          # key the server presents on first contact (ssh-keyscan).
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && bash server-deploy.sh"
